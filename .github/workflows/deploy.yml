name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Types & Astro diagnostics
        run: npm run check
      - name: Build
        run: npm run build
        env:
          PUBLIC_GOATCOUNTER: ${{ vars.PUBLIC_GOATCOUNTER }}
      - name: Broken-link check
        run: npm run lint:links

  build:
    # Only build the deploy artifact for pushes to main.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: set repo variable PUBLIC_GOATCOUNTER to enable analytics.
          PUBLIC_GOATCOUNTER: ${{ vars.PUBLIC_GOATCOUNTER }}
          # Optional: set PUBLIC_WEBMENTION_DOMAIN to pull in webmention.io comments.
          PUBLIC_WEBMENTION_DOMAIN: ${{ vars.PUBLIC_WEBMENTION_DOMAIN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
